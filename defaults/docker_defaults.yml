---
#-| bool
docker_add_alias: true
#-? Add Docker alias to user bashrc

#-| bool
docker_rootful: false
#-? Enable rootful Docker (not recommended)

#-| bool
docker_rootful_enabled: false
#-? Enable rootful Docker daemon

#-| string
docker_rootful_opts: >
  --live-restore --icc=false --default-ulimit nproc=512:1024
  --default-ulimit nofile=100:200 -H fd://
#-? Docker daemon options for rootful mode

#-| string
docker_user: docker-adm
#-? Docker user for rootless Docker installation

#-| bool
docker_user_bashrc: false
#-? Extend Docker user bashrc configuration

#-| bool
docker_allow_privileged_ports: false
#-? Allow Docker to bind privileged ports (< 1024)

#-| bool
docker_allow_ping: false
#-? Allow Docker containers to ping

#-| bool
docker_compose: true
#-? Enable Docker Compose installation

#-| bool
docker_service_restart: false
#-? Restart Docker service after configuration changes

#-| string
docker_rootless_service_template: docker_rootless_cgroupdriver.service.j2
#-? Template for Docker rootless systemd service

#-| string
docker_daemon_json_template: daemon_no_snapshotter.json.j2
#-? Template for Docker daemon configuration

#-| string
path_docker: /opt/Docker/root
#-? Docker installation directory

#-| string
path_docker_root: /opt/Docker/root/lib
#-? Docker root library directory
