---
#-| string
path_backend_config: "/opt/CloudGuard/WAF"
#-? Path to docker-compose and config files

#-| string
yandex_cloud_token: "fakekey"
#-? Yandex Cloud static token.

#-| string
docker_registry_url: "docker.io"
#-? Docker registry name

#-| string
gaddr: "169.254.169.254"
#-? Magic link accessable from VM instance.

#-| string
gpath: "computeMetadata/v1/instance/service-accounts"
#-? Magic Link path to service account access token

#-| string
iam_link: "http://{{ gaddr }}/{{ gpath }}/default/token"
#-? Full iam link. It could be resolved by gaddr and gpath automatically - as it's jinja2 shortage

#-| string
path_cp_agent_waf_data: "{{ path_backend_config }}/Data"
#-? Path where Checkpoint CloudGuard agent will store data. It could be resolved by path_backend_config automatically to Data - as it's jinja2 shortage

#-| string
path_cp_agent_waf_certs: "{{ path_backend_config }}/Certs"
#-? Path where Checkpoint CloudGuard agent will storre Certificates. It could be resolved by path_backend_config automatically to Certs - as it's jinja2 shortage

#-| string
path_cp_agent_waf_configuration: "{{ path_backend_config }}/AgentConfiguration"
#-? Path where Agent Configuration will be stored.It could be resolved by path_backend_config automatically to AgentConfiguration - as it's jinja2 shortage

#-| string
path_cp_nginx_configuration: "{{ path_backend_config }}/NginxConfiguration"
#-? Path where Nginx Configuration will be stored. It could be resolved by path_backend_config automatically to NginxConfiguration - as it's jinja2 shortage

#-| string
path_cp_agent_waf_logs: "{{ path_backend_config }}/Logs"
#-? Path where Logs will be stored. It could be resolved by path_backend_config automatically to Logs - as it's jinja2 shortage

#-| bool
use_yandex_container_registry: false
#-? Does it required to autentificate to Yandex Cloud registry by using Magic Link token of SA?

#-| string
docker_registry_folder: "checkpoint"
#-? Docker registry folder name.

#-| string
docker_cp_agent_image: "cloudguard-appsec-standalone:1580296"
#-? Image name with tag.

#-| string
docker_full_image_path: >-
  {{
     docker_registry_url + "/" +
     docker_registry_folder +
     "/" + docker_cp_agent_image
  }}

#-? Full docker image pull path. It could be resolved by docker_registry_folder, docker_cp_agent_image and docker_registry_url - as it's jinja2 shortage

# Single-agent optional configuration variables

#-| string
#-& cp_waf_agent_cpu_limits
#-? CPU limits for the WAF agent container (e.g., "2.6")

#-| string
#-& cp_waf_agent_mem_limits
#-? Memory limits for the WAF agent container (e.g., "1GB")

#-| list
#-& nginx_limits
#-? List of nginx limit definitions for rate limiting and connection limiting

#-| list
#-& nginx_servers
#-? List of nginx virtual server configurations with SSL and proxy settings

#-| list
#-& nginx_certs
#-? List of certificate content pairs to copy directly into certs directory. nginx_certs and yc_certificates_ids mutually explicit. nginx_certs and yc_certificates_ids mutually explicit.

#-| list
#-& yc_certificates_ids
#-? List of Yandex Certificate Manager certificate IDs to fetch periodically

#-| string
#-& yandex_certificate_crawler_schedule
#-? Systemd timer schedule for certificate crawler (e.g., "*-*-* 03:00:00"). Deafult is ""*-*-* 19:00:00".

# Multi-agent mode configuration

#-| bool
#-& checkpoint_waf_multi_agent
#-? Enable multi-agent mode to deploy multiple WAF profiles on a single host. Default is false.

#-| dict
#-& cp_waf_agent_multi_network
#-? Docker bridge network configuration for multi-agent containers (subnet, gateway)

#-| list
#-& cp_waf_agent_multi_images
#-? List of Docker image families with registry and image configuration per family

#-| list
#-& cp_waf_agent_multi_services
#-? List of service profiles with port mappings and profile identifiers

#-| list
#-& cp_waf_agent_multi_envs
#-? List of per-profile environment configurations with image family and certificate IDs

#-| list
#-& cp_waf_agent_multi_secrets
#-? List of per-profile WAF agent tokens for registration with Check Point

#-| list
#-& cp_waf_agent_multi_resources
#-? List of per-profile Docker resource limits (CPU and memory)

# Required authentication variables

#-| string
#-! cp_waf_agent_authorization_token
#-? Check Point WAF agent registration token (override with vault or secrets)

#-| string
yandex_cloud_token_static: "dummy-xxxx-xxxx-xxx"
#-? Yandex Cloud static IAM token for testing (override with vault or secrets)
