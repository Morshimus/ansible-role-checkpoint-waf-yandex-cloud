---
- name: Converge
  hosts: all
  vars:
    cp_waf_agent_authorization_token: dummy-xxxx-xxx-xxx
  tasks:
    - name: "Include Ansible role"
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      tags:
        - docker
        - checkpoint_waf_agent
