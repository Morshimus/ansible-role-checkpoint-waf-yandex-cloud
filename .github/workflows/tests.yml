---
name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: >-
          Open a tmate SSH session if the run fails
          (keeps the molecule container alive)
        type: boolean
        default: false
      scenario:
        description: "Which scenario(s) to run"
        type: choice
        options:
          - all
          - default
          - multi
        default: all

jobs:
  test:
    name: Molecule Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - scenario: default
          - scenario: multi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Diffusion Tests for Scenario ${{ matrix.scenario }}
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.scenario == 'all' ||
          inputs.scenario == matrix.scenario
        uses: Polar-Team/diffusion/diffusion-test@main
        with:
          diffusion-version: "latest"
          scenario: "${{ matrix.scenario }}"
          run-lint: "true"
          run-verify: "true"
          run-idempotence: "true"
          cache-enabled: "true"
          cache-uv: "true"
          cache-docker: "true"

  debug:
    name: Manual Debug Session
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.debug
    env:
      SCENARIO: >-
        ${{ inputs.scenario == 'all' && 'default' || inputs.scenario }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Diffusion and prepare host
        uses: Polar-Team/diffusion/diffusion-test@main
        with:
          diffusion-version: "latest"
          scenario: >-
            ${{ inputs.scenario == 'all' && 'default' || inputs.scenario }}
          run-converge: "false"
          run-lint: "false"
          run-verify: "false"
          run-idempotence: "false"
          cache-enabled: "true"
          cache-uv: "true"
          cache-docker: "true"

      - name: Run converge
        shell: bash
        run: diffusion molecule --ci --scenario "$SCENARIO"

      - name: Run verify
        if: success()
        shell: bash
        run: diffusion molecule --ci --scenario "$SCENARIO" --verify

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          docker ps -a > diagnostics/runner-docker-ps.txt 2>&1
          docker ps -a --format '{{.Names}}' \
            > diagnostics/molecule-containers.txt 2>&1

          dump() {
            c="$1"
            shift
            out="diagnostics/$c.txt"
            echo "=== $* ===" >> "$out"
            docker exec "$c" "$@" >> "$out" 2>&1
            echo "" >> "$out"
          }

          for c in Ubuntu-24-04 Ubuntu-22-04; do
            docker inspect "$c" > /dev/null 2>&1 || continue
            out="diagnostics/$c.txt"

            dump "$c" ss -lntpu

            echo "=== systemctl status docker (user) ===" >> "$out"
            docker exec "$c" \
              systemctl --user -M docker-adm@ status docker \
              >> "$out" 2>&1 \
              || docker exec "$c" runuser -u docker-adm -- \
                   systemctl --user status docker >> "$out" 2>&1
            echo "" >> "$out"

            dump "$c" runuser -u docker-adm -- \
              journalctl --user -u docker --no-pager -n 200
            dump "$c" loginctl show-user docker-adm
            dump "$c" ls -la /sys/fs/cgroup/user.slice/
            dump "$c" runuser -u docker-adm -- docker ps -a
            dump "$c" runuser -u docker-adm -- docker logs cp_waf_agent
            dump "$c" ls -laR /opt/CloudGuard/WAF
          done
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.scenario }}
          path: diagnostics/
          if-no-files-found: ignore

      - name: Setup tmate session
        if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
